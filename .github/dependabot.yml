# Weekly dependency updates (plan 0.19). PRs target `next`, never `main`.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: next
    schedule: { interval: weekly, day: monday }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: next
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker-compose
    directory: /
    target-branch: next
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
